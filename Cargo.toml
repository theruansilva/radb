[package]
name = "radb-core"
version = "0.1.0"
edition = "2024"
authors = ["Ruan Silva <progmruansilva@gmail.com>"]
license = "MIT"
description = "Pure Rust implementation of the Android Debug Bridge (ADB) protocol"
readme = "README.md"
repository = "https://github.com/theruansilva/radb"
keywords = ["adb", "android", "emulator", "automation", "tokio"]
categories = ["development-tools", "asynchronous"]
[dependencies]
tokio = { version = "1.43", features = ["full"] }
bytes = "1.10"
rsa = { version = "0.9", features = ["pem", "hazmat"] }
pkcs8 = { version = "0.10", features = ["pem", "std"] }
sha1 = "0.10"
base64 = "0.22"
rand = "0.8"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = "0.3"
async-trait = "0.1"
